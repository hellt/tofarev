name: ToFaRev reusable review
on:
  workflow_call:
    inputs:
      bot_repository:
        required: true
        type: string
      bot_ref:
        required: true
        type: string
      app_client_id:
        required: true
        type: string
      trusted_config:
        description: Validated JSON configuration; use defaults for Containerlab.
        type: string
        default: '{}'
    secrets:
      TOFAREV_API_KEY:
        required: true
      TOFAREV_APP_PRIVATE_KEY:
        required: true
      TOFAREV_PAGES_DEPLOY_KEY:
        description: SSH deploy key with write access to the session Pages repository.
        required: false
permissions:
  contents: read
concurrency:
  group: tofarev-${{ github.repository_id }}-${{ github.event.comment.id }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
    env:
      TOFAREV_CONFIG: /tmp/tofarev-trusted-config.json
    steps:
      - name: Validate trusted workflow inputs
        env:
          BOT_REF: ${{ inputs.bot_ref }}
          BOT_REPOSITORY: ${{ inputs.bot_repository }}
          TRUSTED_CONFIG: ${{ inputs.trusted_config }}
        run: |
          node -e 'if (!/^[a-f0-9]{40}$/.test(process.env.BOT_REF) || !/^[a-zA-Z0-9][\w.-]*\/[a-zA-Z0-9][\w.-]*$/.test(process.env.BOT_REPOSITORY)) process.exit(1); require("fs").writeFileSync(process.env.TOFAREV_CONFIG, process.env.TRUSTED_CONFIG)'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ inputs.bot_repository }}
          ref: ${{ inputs.bot_ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - run: npm ci --ignore-scripts && npm run build
      - name: Authorize comment
        id: admission
        run: node dist/src/cli.js admit
      - name: Create preparation App token
        if: steps.admission.outputs.accepted == 'true'
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.TOFAREV_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
      - name: Prepare recorded source and status comment
        if: steps.admission.outputs.accepted == 'true'
        id: prepare
        env:
          TOFAREV_GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: node dist/src/cli.js prepare .work
      - name: Preserve trusted preparation context
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tofarev-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/prepared.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - name: Preserve read-only source snapshot
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tofarev-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/source
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
  review:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TOFAREV_CONFIG: .work/config.json
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ inputs.bot_repository }}
          ref: ${{ inputs.bot_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: tofarev-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/source
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - run: npm ci --ignore-scripts && npm run build
      - name: Build pinned reviewer
        run: docker build --tag tofarev-reviewer .
      - name: Run isolated reviewer
        id: start
        env:
          TOFAREV_API_KEY: ${{ secrets.TOFAREV_API_KEY }}
          TRUSTED_CONFIG: ${{ inputs.trusted_config }}
        run: |
          printf '%s' "$TRUSTED_CONFIG" > .work/config.json
          mkdir -p .work/session
          chmod 777 .work/session
          chmod -R a+rX .work/source
          (
            set +e
            docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 3g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g,mode=1777 --tmpfs /home/node:rw,nosuid,nodev,size=256m,uid=1000,gid=1000 \
            --mount type=bind,src="$PWD/.work/source",dst=/source,readonly \
            --mount type=bind,src="$PWD/.work/config.json",dst=/config.json,readonly \
            --mount type=bind,src="$PWD/.work/session",dst=/session \
            --env TOFAREV_SESSION_DIR=/session \
            --env TOFAREV_API_KEY --env TOFAREV_CONFIG=/config.json \
              tofarev-reviewer review /source > .work/result.json 2> .work/reviewer.log
            echo "$?" > .work/reviewer.exit
          ) > /dev/null 2>&1 &
          for attempt in $(seq 1 90); do
            if test -s .work/session/snapshot.json; then
              echo 'session_ready=true' >> "$GITHUB_OUTPUT"
              break
            fi
            test ! -f .work/reviewer.exit || break
            sleep 1
          done
      - name: Publish first session snapshot
        if: steps.start.outputs.session_ready == 'true'
        id: session
        continue-on-error: true
        env:
          TOFAREV_PAGES_DEPLOY_KEY: ${{ secrets.TOFAREV_PAGES_DEPLOY_KEY }}
        run: node dist/src/cli.js publish-session .work/session/snapshot.json > .work/session-link.json
      - name: Preserve live session link
        if: steps.session.outcome == 'success' && steps.start.outputs.session_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tofarev-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/session-link.json
          retention-days: 1
          if-no-files-found: error
      - name: Wait for isolated reviewer
        env:
          TOFAREV_PAGES_DEPLOY_KEY: ${{ secrets.TOFAREV_PAGES_DEPLOY_KEY }}
        run: bash scripts/watch-review.sh
      - name: Preserve session snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tofarev-transcript-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/session/snapshot.json
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve bounded result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tofarev-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/result.json
          retention-days: 1
          if-no-files-found: warn
  progress:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && fromJSON(inputs.trusted_config).shareSessions == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    env:
      TOFAREV_CONFIG: /tmp/tofarev-trusted-config.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ inputs.bot_repository }}
          ref: ${{ inputs.bot_ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - name: Load trusted configuration
        env:
          TRUSTED_CONFIG: ${{ inputs.trusted_config }}
        run: printf '%s' "$TRUSTED_CONFIG" > "$TOFAREV_CONFIG"
      - run: npm ci --ignore-scripts && npm run build
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: tofarev-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/prepared
      - name: Wait for live session artifact
        id: session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq ".artifacts[] | select(.name == \"tofarev-session-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\") | .id")
            if test -n "$artifact_id"; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 5
          done
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        if: steps.session.outputs.ready == 'true'
        with:
          name: tofarev-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/session
      - name: Create status App token
        if: steps.session.outputs.ready == 'true'
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.TOFAREV_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: Publish live session link
        if: steps.session.outputs.ready == 'true'
        env:
          TOFAREV_GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: node dist/src/cli.js progress .work/prepared .work/session/session-link.json
  publish:
    needs: [prepare, review, progress]
    if: always() && needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TOFAREV_CONFIG: /tmp/tofarev-trusted-config.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ inputs.bot_repository }}
          ref: ${{ inputs.bot_ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - name: Load trusted configuration
        env:
          TRUSTED_CONFIG: ${{ inputs.trusted_config }}
        run: printf '%s' "$TRUSTED_CONFIG" > "$TOFAREV_CONFIG"
      - run: npm ci --ignore-scripts && npm run build
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: tofarev-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/prepared
      - name: Download reviewer output when available
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: tofarev-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/result
      - name: Download session snapshot when available
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: tofarev-transcript-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/session
      - name: Publish final session snapshot
        if: fromJSON(inputs.trusted_config).shareSessions == true
        continue-on-error: true
        env:
          TOFAREV_PAGES_DEPLOY_KEY: ${{ secrets.TOFAREV_PAGES_DEPLOY_KEY }}
        run: node dist/src/cli.js publish-session .work/session/snapshot.json > .work/session-link.json
      - name: Create finalization App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.TOFAREV_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
      - name: Validate and update the existing bot comment
        env:
          TOFAREV_GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          TOFAREV_REVIEW_STATUS: ${{ needs.review.result }}
        run: node dist/src/cli.js publish .work/prepared .work/result/result.json .work/session-link.json
